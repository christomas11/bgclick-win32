name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: 跑测试
        run: python -m pytest -q

      - name: 构建并安装（验证打包配置）
        run: |
          python -m pip install . --no-deps
          python -c "import bgkit; print('version:', bgkit.__version__)"
          bgclick --version

      - name: 验证四个入口都在
        run: |
          bgclick --list
          bgclient --version
          bgserver --help
          bgtray --version

      - name: 验证 MCP 握手
        # 不写成 python -c：windows runner 用 pwsh 包一层，
        # 内联的 \" 和 \n 会被 PowerShell 的引号解析吃掉（会报 SyntaxError）。
        run: python tests/ci_mcp_handshake.py

      - name: 验证零第三方依赖
        # 全部保持 ASCII：带中文的 python -c 在 pwsh 下容易被转码破坏
        run: python -c "import importlib.metadata as m, sys; r = m.requires('bgclick') or []; print('dependencies:', r); sys.exit(1 if r else 0)"
